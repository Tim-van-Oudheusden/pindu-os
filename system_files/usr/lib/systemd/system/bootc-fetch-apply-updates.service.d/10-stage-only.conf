# The stock unit runs `bootc upgrade --apply`, which reboots as soon as an update is
# downloaded. A console must never reboot in the middle of a game: download and stage only,
# and let the update take effect on the next boot.
[Service]
ExecStart=
ExecStart=/usr/bin/bootc upgrade --quiet
# Publish the new status (a staged update) for the launcher's system panel. A failed run
# changes no deployment, so only a successful one needs it.
ExecStartPost=/usr/bin/systemctl start pindu-os-update-status.service
