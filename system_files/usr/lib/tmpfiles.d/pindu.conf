# State of the pindu user. /var is not part of the image, so the home directory is created on
# first boot and left alone afterwards.
d /var/home/pindu 0700 pindu pindu -

# A default Secret Service keyring without a password, created once. With autologin there is
# no login password to unlock an encrypted keyring, and gnome-keyring would otherwise ask the
# user to invent one on a screen that has no keyboard. The disk is not encrypted either, so
# an encrypted keyring with an empty password would protect nothing more
# (docs/decisions/0010-keyring.md).
d /var/home/pindu/.local 0700 pindu pindu -
d /var/home/pindu/.local/share 0700 pindu pindu -
d /var/home/pindu/.local/share/keyrings 0700 pindu pindu -
f /var/home/pindu/.local/share/keyrings/default 0600 pindu pindu - Default_keyring
f /var/home/pindu/.local/share/keyrings/Default_keyring.keyring 0600 pindu pindu - [keyring]\ndisplay-name=Default keyring\nctime=0\nmtime=0\nlock-on-idle=false\nlock-after=false\n

# Flatpak's system installation. The flatpak package ships the directory in /var, which only a
# new installation would get; flatpak creates the repository inside on first use and adds
# Flathub to it (docs/decisions/0013-game-sources.md).
d /var/lib/flatpak 0755 root root -
