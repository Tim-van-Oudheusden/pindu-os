name: PR

# Lints, builds and boot-tests a pull request. The code under test comes from the pull
# request, so this workflow holds no secret, has a read-only token and never logs in to a
# registry: nothing a pull request does here can reach GHCR or the signing key.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Lint shell, Containerfile, Justfile and workflows
        run: just lint

  build:
    name: Build and test (${{ matrix.variant }})
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, dev]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install container and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends podman jq qemu-system-x86 qemu-utils ovmf

      - name: Lay out root's container storage for bootc-image-builder
        run: |
          # bootc-image-builder mounts /var/lib/containers/storage into its build sandbox, which
          # fails on GitHub's runners with their stock storage configuration
          # (https://github.com/osbuild/bootc-image-builder/issues/446). This is the fix that
          # osbuild/bootc-image-builder-action applies.
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' |
            sudo tee /etc/containers/storage.conf

      - name: Allow KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the image (includes bootc container lint)
        run: just build "${VARIANT}"

      - name: Container tests
        run: just test "${VARIANT}"

      - name: Build the qcow2 disk image
        run: just build-qcow2 "${VARIANT}"

      - name: VM boot test
        run: just test-vm "${VARIANT}"

      - name: Upload the screenshot and the guest's report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-boot-${{ matrix.variant }}
          path: |
            output/${{ matrix.variant }}/test-boot/screenshot.*
            output/${{ matrix.variant }}/test-boot/*.log
          if-no-files-found: warn
          retention-days: 14
