name: Promote

# Retags a tested :testing build as :stable. Nothing is rebuilt: the same digest, with the
# signature it already has, gets a second tag. A digest without a valid signature from our
# key is refused, and so is a new launcher whose hardware check has not passed
# (.github/scripts/launcher-gate.sh). The "promote" environment requires a reviewer
# (docs/runbook.md).

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Tag to promote: testing, or a version tag such as 45.20261115.0"
        type: string
        default: testing
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ matrix.variant }} to stable
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: promote
    permissions:
      contents: read
      packages: write # retag the image on GHCR
    strategy:
      # Both variants move together, so stable prod and stable dev are the same build.
      fail-fast: true
      max-parallel: 1
      matrix:
        variant: [prod, dev]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The launcher gate reads image.env at the commits the two images were built from.
          fetch-depth: 0

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.1.4"

      - name: Install skopeo
        run: command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install --yes skopeo; }

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the signature and the launcher hardware check, then retag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # read the launcher's public release issues
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SOURCE: ${{ inputs.source }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          if ! [[ "${SOURCE}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || [[ "${SOURCE}" == stable ]]; then
            echo "::error::'${SOURCE}' is not a tag that can be promoted"
            exit 1
          fi
          name=pindu-os
          [[ "${VARIANT}" == prod ]] || name="pindu-os-${VARIANT}"
          image="ghcr.io/${REPOSITORY_OWNER,,}/${name}"

          # Resolve the tag once, so the check and the retag act on the same image even if
          # a build moves the tag in between.
          digest=$(skopeo inspect --no-tags --format '{{.Digest}}' "docker://${image}:${SOURCE}")
          # The signature is in the classic format; without the flag cosign 3 looks only at the
          # image's attestations, finds GitHub's keyless ones and fails.
          cosign verify --new-bundle-format=false --key cosign.pub "${image}@${digest}" >/dev/null
          # A new launcher reaches stable only after its hardware check passed (docs/runbook.md,
          # "Launcher hardware check").
          .github/scripts/launcher-gate.sh "${image}@${digest}" "${image}:stable"

          skopeo copy --all --preserve-digests "docker://${image}@${digest}" "docker://${image}:stable"
          promoted=$(skopeo inspect --no-tags --format '{{.Digest}}' "docker://${image}:stable")
          if [[ "${promoted}" != "${digest}" ]]; then
            echo "::error::${image}:stable is ${promoted}, expected ${digest}"
            exit 1
          fi
          echo "\`${image}:stable\` is now \`${digest}\` (was \`:${SOURCE}\`)" >>"${GITHUB_STEP_SUMMARY}"

  disk:
    name: Disk images of the new stable
    needs: promote
    permissions:
      contents: read
      packages: read # pull the promoted image
    # "./" rather than GitHub's newer "$/" form, which actionlint 1.7.12 rejects. A reusable
    # workflow is always read from this commit, so the two mean the same here.
    uses: ./.github/workflows/disk.yml # zizmor: ignore[self-repository]
    with:
      variant: prod
      ref: stable
